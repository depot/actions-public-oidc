name: refresh-session
on:
  workflow_dispatch: {}
  schedule:
    - cron: '23 1 * * *' # Every day at 1:23 AM UTC

jobs:
  refresh-session:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install browsers
        run: pnpm playwright install chromium

      - name: Install 1Password CLI
        uses: 1password/install-cli-action@v1

      - name: Configure 1Password Service Account
        uses: 1password/load-secrets-action/configure@v1
        with:
          service-account-token: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

      - name: Load credentials
        run: |
          for attempt in 1 2 3; do
            if USERNAME="$(op read 'op://actions-oidc/GitHub - depot-public-oidc/username')" \
              && PASSWORD="$(op read 'op://actions-oidc/GitHub - depot-public-oidc/password')"; then
              echo "::add-mask::$USERNAME"
              echo "::add-mask::$PASSWORD"
              echo "USERNAME=$USERNAME" >> "$GITHUB_ENV"
              echo "PASSWORD=$PASSWORD" >> "$GITHUB_ENV"
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "1Password credential read failed (attempt $attempt of 3); retrying in 15s" >&2
              sleep 15
            fi
          done
          echo "1Password credential read failed after 3 attempts" >&2
          exit 1

      - name: Load OTP token
        run: |
          for attempt in 1 2 3; do
            if OTP="$(op item get --vault 'actions-oidc' 'GitHub - depot-public-oidc' --otp)"; then
              echo "::add-mask::$OTP"
              echo "OTP=$OTP" >> "$GITHUB_ENV"
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "1Password OTP read failed (attempt $attempt of 3); retrying in 15s" >&2
              sleep 15
            fi
          done
          echo "1Password OTP read failed after 3 attempts" >&2
          exit 1

      - name: Refresh session
        run: pnpm refresh-session || pnpm refresh-session
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

      - name: Keep schedule enabled
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/refresh-session.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Save screenshot
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshot
          path: tmp/screenshot.png
